<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PaperBrief — Research Feeds</title>
  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#6c63ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 1.8rem;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    header .tagline {
      color: #888;
      font-size: 0.9rem;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 16px;
      max-width: 700px;
      width: 100%;
    }

    .tab-btn {
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid #333;
      background: transparent;
      color: #aaa;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }

    .tab-btn:hover { border-color: #6c63ff; color: #e8e8e8; }
    .tab-btn.active { background: #6c63ff; border-color: #6c63ff; color: #fff; }
    .tab-btn.saved-tab { border-color: #f0c04033; color: #f0c040aa; }
    .tab-btn.saved-tab.active { background: #f0c04022; border-color: #f0c040; color: #f0c040; }

    /* Search */
    .search-wrap {
      width: 100%;
      max-width: 700px;
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      padding: 10px 16px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e8e8e8;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input::placeholder { color: #444; }
    .search-input:focus { border-color: #6c63ff; }

    /* Feed */
    #feed { width: 100%; max-width: 700px; }

    /* Skeleton */
    .skeleton-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .skel-line {
      background: #2a2a2a;
      border-radius: 4px;
      height: 12px;
      margin-bottom: 10px;
    }

    .skel-line.short { width: 40%; }
    .skel-line.medium { width: 70%; }
    .skel-line.full { width: 100%; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Paper cards */
    .paper-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: border-color 0.15s;
      overflow: hidden;
    }

    .paper-card:hover { border-color: #444; }
    .paper-card.expanded { border-color: #6c63ff44; }

    .card-main {
      padding: 20px 20px 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .card-body { flex: 1; min-width: 0; }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .badge {
      background: #6c63ff22;
      color: #a89fff;
      border: 1px solid #6c63ff44;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .card-date { color: #555; font-size: 0.78rem; }

    .card-title {
      font-size: 0.98rem;
      font-weight: 600;
      color: #e8e8e8;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .card-authors {
      font-size: 0.78rem;
      color: #666;
      margin-bottom: 10px;
    }

    .card-summary {
      font-size: 0.9rem;
      color: #bbb;
      line-height: 1.6;
    }

    /* Star button */
    .star-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      color: #333;
      padding: 0;
      flex-shrink: 0;
      line-height: 1;
      transition: color 0.15s, transform 0.1s;
      margin-top: 2px;
    }

    .star-btn:hover { color: #f0c040; transform: scale(1.2); }
    .star-btn.starred { color: #f0c040; }

    /* Expand arrow */
    .card-arrow {
      color: #444;
      font-size: 1rem;
      flex-shrink: 0;
      transition: color 0.15s, transform 0.2s;
      padding-top: 4px;
    }

    .paper-card.expanded .card-arrow {
      color: #6c63ff;
      transform: rotate(90deg);
    }

    /* Expand section */
    .card-expand {
      display: none;
      padding: 16px 24px 20px;
      border-top: 1px solid #222;
      background: #1e1e1e;
    }

    .paper-card.expanded .card-expand { display: block; }

    .expand-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .abstract-text {
      font-size: 0.85rem;
      color: #aaa;
      line-height: 1.7;
      font-family: "SF Mono", "Fira Mono", "Consolas", monospace;
      margin-bottom: 16px;
    }

    /* Prerequisites — inside expanded dropdown */
    .prereq-section {
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      border-left: 3px solid #f0c040;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .prereq-heading {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      color: #f0c040;
      margin-bottom: 12px;
    }

    .prereq-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .prereq-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.88rem;
      color: #ddd;
      line-height: 1.55;
    }

    .prereq-list li::before {
      content: "→";
      color: #f0c040;
      font-weight: bold;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .prereq-loading {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #666;
      font-style: italic;
    }

    .prereq-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #333;
      border-top-color: #f0c040;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Expand trigger row */
    .card-expand-trigger {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding: 10px 20px 14px;
      cursor: pointer;
    }

    .expand-hint {
      font-size: 0.78rem;
      color: #555;
    }

    .paper-card.expanded .expand-hint { color: #6c63ff; }
    .paper-card.expanded .card-arrow { color: #6c63ff; transform: rotate(90deg); }

    .open-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      background: #6c63ff;
      color: #fff;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }

    .open-btn:hover { background: #574fd6; }

    /* Load more */
    #load-more-wrap {
      text-align: center;
      margin-top: 8px;
      display: none;
    }

    #load-more-btn {
      padding: 11px 32px;
      background: transparent;
      border: 1px solid #333;
      border-radius: 8px;
      color: #aaa;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }

    #load-more-btn:hover { border-color: #6c63ff; color: #e8e8e8; }
    #load-more-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Misc */
    .error-msg {
      color: #ff6b6b;
      background: #1a1111;
      border: 1px solid #3a2020;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: none;
    }

    .no-results {
      text-align: center;
      color: #555;
      font-size: 0.9rem;
      padding: 40px 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>PaperBrief</h1>
    <p class="tagline">Recent arXiv papers, explained in plain English.</p>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-cat="cs.AI">AI</button>
    <button class="tab-btn" data-cat="cs.LG">Machine Learning</button>
    <button class="tab-btn" data-cat="cs.CL">NLP</button>
    <button class="tab-btn" data-cat="cs.CV">Computer Vision</button>
    <button class="tab-btn" data-cat="math.ST">Statistics</button>
    <button class="tab-btn" data-cat="math.NA">Numerical Analysis</button>
    <button class="tab-btn saved-tab" data-cat="__saved__">Saved ★</button>
  </div>

  <div class="search-wrap">
    <input
      type="search"
      id="search-input"
      class="search-input"
      placeholder="Filter by title, author, or summary…"
      autocomplete="off"
      spellcheck="false"
    />
  </div>

  <div id="feed">
    <div class="error-msg" id="error-msg"></div>
  </div>

  <div id="load-more-wrap">
    <button id="load-more-btn" onclick="loadMore()">Load more</button>
  </div>

  <script>
    // ─── State ────────────────────────────────────────────────────────────────
    let currentCategory = "cs.AI";
    let currentStart = 0;
    let loading = false;

    // ─── Favorites (localStorage) ────────────────────────────────────────────
    const FAV_KEY = "paperbrief_favorites";

    function getFavorites() {
      try { return JSON.parse(localStorage.getItem(FAV_KEY) || "{}"); }
      catch { return {}; }
    }

    function saveFavorite(paper) {
      const favs = getFavorites();
      favs[paper.id] = paper;
      try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch {}
    }

    function removeFavorite(paperId) {
      const favs = getFavorites();
      delete favs[paperId];
      try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch {}
    }

    function isFavorite(paperId) {
      return !!getFavorites()[paperId];
    }

    // ─── Helpers ──────────────────────────────────────────────────────────────
    function formatAuthors(authors) {
      if (!authors || authors.length === 0) return "";
      return authors.length === 1 ? authors[0] : authors[0] + " et al.";
    }

    function formatDate(iso) {
      if (!iso) return "";
      const [year, month] = iso.split("-");
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return (months[parseInt(month) - 1] || month) + " " + year;
    }

    function escHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function reapplySearch() {
      const query = (document.getElementById("search-input")?.value || "").trim().toLowerCase();
      if (!query) return;
      document.querySelectorAll(".paper-card").forEach(card => {
        const title   = (card.querySelector(".card-title")?.textContent   || "").toLowerCase();
        const authors = (card.querySelector(".card-authors")?.textContent || "").toLowerCase();
        const summary = (card.querySelector(".card-summary")?.textContent || "").toLowerCase();
        card.style.display =
          title.includes(query) || authors.includes(query) || summary.includes(query) ? "" : "none";
      });
    }

    // ─── Skeleton ─────────────────────────────────────────────────────────────
    function renderSkeletons(n = 3) {
      const feed = document.getElementById("feed");
      let html = `<div class="error-msg" id="error-msg"></div>`;
      for (let i = 0; i < n; i++) {
        html += `
          <div class="skeleton-card">
            <div class="skel-line short"></div>
            <div class="skel-line medium" style="height:14px;margin-bottom:12px"></div>
            <div class="skel-line full"></div>
            <div class="skel-line full"></div>
            <div class="skel-line medium"></div>
          </div>`;
      }
      feed.innerHTML = html;
    }

    // ─── Render cards ─────────────────────────────────────────────────────────
    function renderCards(papers, append = false) {
      const feed = document.getElementById("feed");
      if (!append) {
        feed.innerHTML = `<div class="error-msg" id="error-msg"></div>`;
      }

      papers.forEach((paper) => {
        const starred = isFavorite(paper.id);

        const card = document.createElement("div");
        card.className = "paper-card";

        card.innerHTML = `
          <div class="card-main">
            <div class="card-body">
              <div class="card-meta">
                <span class="badge">${escHtml(paper.category_label || "")}</span>
                <span class="card-date">${formatDate(paper.published)}</span>
              </div>
              <div class="card-title">${escHtml(paper.title)}</div>
              <div class="card-authors">${escHtml(formatAuthors(paper.authors))}</div>
              <div class="card-summary">${escHtml(paper.summary)}</div>
            </div>
            <button class="star-btn ${starred ? "starred" : ""}"
                    aria-label="${starred ? "Remove from saved" : "Save paper"}">
              ${starred ? "★" : "☆"}
            </button>
            <div class="card-arrow">›</div>
          </div>
          <div class="card-expand">
            <div class="prereq-section">
              <div class="prereq-heading">⚠ What you need to know first</div>
              <div class="prereq-loading">
                <span class="prereq-spinner"></span>
                Analysing what the author assumes you know…
              </div>
            </div>
            <div class="expand-label" style="margin-top:18px">Full Abstract</div>
            <div class="abstract-text">${escHtml(paper.abstract)}</div>
            <a class="open-btn" href="${escHtml(paper.arxiv_url)}" target="_blank" rel="noopener">
              Open on arXiv ↗
            </a>
          </div>`;


        // ── click handler ──
        card.addEventListener("click", (e) => {
          if (e.target.closest("a")) return;

          const starBtn = e.target.closest(".star-btn");
          if (starBtn) {
            e.stopPropagation();
            if (isFavorite(paper.id)) {
              removeFavorite(paper.id);
              starBtn.textContent = "☆";
              starBtn.classList.remove("starred");
              starBtn.setAttribute("aria-label", "Save paper");
              if (currentCategory === "__saved__") {
                card.remove();
                if (!document.querySelector(".paper-card")) {
                  feed.innerHTML += `<p class="no-results">No saved papers yet. Star a paper to save it here.</p>`;
                }
              }
            } else {
              saveFavorite(paper);
              starBtn.textContent = "★";
              starBtn.classList.add("starred");
              starBtn.setAttribute("aria-label", "Remove from saved");
            }
            return;
          }

          const wasExpanded = card.classList.contains("expanded");
          card.classList.toggle("expanded");

          // First open: fetch prerequisites immediately
          if (!wasExpanded && !card._prereqLoaded) {
            card._prereqLoaded = true;
            const prereqSection = card.querySelector(".prereq-section");
            fetch("/api/prerequisites", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: paper.id, abstract: paper.abstract })
            })
              .then(r => r.json())
              .then(data => {
                const prereqs = data.prerequisites || [];
                const box = card.querySelector(".prereq-section");
                if (!box) return;
                if (prereqs.length > 0) {
                  box.innerHTML = `
                    <div class="prereq-heading">⚠ What you need to know first</div>
                    <ul class="prereq-list">
                      ${prereqs.map(p => `<li>${escHtml(p)}</li>`).join("")}
                    </ul>`;
                } else {
                  box.innerHTML = `
                    <div class="prereq-heading">⚠ What you need to know first</div>
                    <p style="font-size:0.82rem;color:#666;margin-top:6px">Could not extract prerequisites for this paper.</p>`;
                }
              })
              .catch(() => {
                const box = card.querySelector(".prereq-section");
                if (box) box.innerHTML = `
                  <div class="prereq-heading">⚠ What you need to know first</div>
                  <p style="font-size:0.82rem;color:#666;margin-top:6px">Failed to load — try clicking again.</p>`;
              });
          }
        });

        feed.appendChild(card);
      });

      document.getElementById("load-more-wrap").style.display =
        currentCategory === "__saved__" ? "none" : "block";

      // Re-apply any active search filter to newly added cards
      reapplySearch();

    }

    // ─── Saved tab ────────────────────────────────────────────────────────────
    function renderSaved() {
      const feed = document.getElementById("feed");
      feed.innerHTML = `<div class="error-msg" id="error-msg"></div>`;
      document.getElementById("load-more-wrap").style.display = "none";

      const papers = Object.values(getFavorites());
      if (papers.length === 0) {
        feed.innerHTML += `<p class="no-results">No saved papers yet. Star a paper to save it here.</p>`;
        return;
      }
      renderCards(papers, true);
    }

    // ─── Load feed ────────────────────────────────────────────────────────────
    async function loadFeed(category, start = 0, append = false) {
      if (loading) return;
      loading = true;

      if (!append) renderSkeletons(3);

      const loadMoreBtn = document.getElementById("load-more-btn");
      if (loadMoreBtn) loadMoreBtn.disabled = true;

      try {
        const res = await fetch(`/api/feed?category=${encodeURIComponent(category)}&start=${start}`);
        if (!res.ok) throw new Error(`Server error ${res.status}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        renderCards(data.papers, append);
        currentStart = start + data.papers.length;
      } catch (err) {
        if (!append) {
          document.getElementById("feed").innerHTML =
            `<div class="error-msg" id="error-msg" style="display:block">${escHtml(err.message)}</div>`;
        } else {
          const el = document.getElementById("error-msg");
          if (el) { el.textContent = err.message; el.style.display = "block"; }
        }
      } finally {
        loading = false;
        const btn = document.getElementById("load-more-btn");
        if (btn) btn.disabled = false;
      }
    }

    function loadMore() {
      if (currentCategory === "__saved__") return;
      loadFeed(currentCategory, currentStart, true);
    }

    // ─── Tab switching ────────────────────────────────────────────────────────
    document.getElementById("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".tab-btn");
      if (!btn) return;

      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      // Clear search
      const searchInput = document.getElementById("search-input");
      if (searchInput) {
        searchInput.value = "";
        document.querySelectorAll(".paper-card").forEach(c => c.style.display = "");
      }

      const cat = btn.dataset.cat;
      currentCategory = cat;
      currentStart = 0;

      if (cat === "__saved__") {
        renderSaved();
        return;
      }

      loadFeed(cat, 0, false);
    });

    // ─── Search ───────────────────────────────────────────────────────────────
    document.getElementById("search-input").addEventListener("input", (e) => {
      const query = e.target.value.trim().toLowerCase();
      const cards = document.querySelectorAll(".paper-card");
      let visibleCount = 0;

      cards.forEach(card => {
        const title   = (card.querySelector(".card-title")?.textContent   || "").toLowerCase();
        const authors = (card.querySelector(".card-authors")?.textContent || "").toLowerCase();
        const summary = (card.querySelector(".card-summary")?.textContent || "").toLowerCase();
        const matches = !query || title.includes(query) || authors.includes(query) || summary.includes(query);
        card.style.display = matches ? "" : "none";
        if (matches) visibleCount++;
      });

      let noResults = document.getElementById("search-no-results");
      if (visibleCount === 0 && query) {
        if (!noResults) {
          noResults = document.createElement("p");
          noResults.id = "search-no-results";
          noResults.className = "no-results";
          noResults.textContent = "No papers match your search.";
          document.getElementById("feed").appendChild(noResults);
        }
        noResults.style.display = "";
      } else if (noResults) {
        noResults.style.display = "none";
      }
    });

    // ─── PWA: register service worker ─────────────────────────────────────────
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js")
          .then(reg => console.log("SW registered:", reg.scope))
          .catch(err => console.warn("SW registration failed:", err));
      });
    }

    // ─── Initial load ─────────────────────────────────────────────────────────
    loadFeed(currentCategory, 0, false);
  </script>

</body>
</html>
