<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Confusion Detector 🧠</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 700px;
      margin-bottom: 24px;
    }

    textarea {
      width: 100%;
      height: 160px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e8e8e8;
      font-size: 0.95rem;
      padding: 14px;
      resize: vertical;
      outline: none;
      font-family: inherit;
      line-height: 1.6;
    }

    textarea:focus { border-color: #555; }

    button {
      margin-top: 14px;
      width: 100%;
      padding: 13px;
      background: #6c63ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #574fd6; }
    button:disabled { background: #333; color: #666; cursor: not-allowed; }

    .results { display: none; width: 100%; max-width: 700px; }

    .section {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }

    .section h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #6c63ff;
      margin-bottom: 12px;
    }

    .section ul { list-style: none; padding: 0; }

    .section ul li {
      padding: 7px 0;
      border-bottom: 1px solid #222;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #ccc;
    }

    .section ul li:last-child { border-bottom: none; }

    .section ul li::before {
      content: "→ ";
      color: #6c63ff;
      font-weight: bold;
    }

    .error {
      color: #ff6b6b;
      background: #1a1111;
      border: 1px solid #3a2020;
      border-radius: 8px;
      padding: 14px;
      font-size: 0.9rem;
      display: none;
    }

    .spinner {
      display: none;
      text-align: center;
      color: #888;
      padding: 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h1>🧠 Confusion Detector</h1>
  <p class="subtitle">Paste a confusing research paragraph. Get clarity.</p>

  <div class="card">
    <textarea id="inputText" placeholder="Paste your confusing research paragraph here..."></textarea>
    <button id="analyzeBtn" onclick="analyze()">Detect Confusion</button>
  </div>

  <div class="error" id="errorBox"></div>
  <div class="spinner" id="spinner">Analyzing... ⏳</div>

  <div class="results" id="results">
    <div class="section">
      <h2>What's Confusing</h2>
      <ul id="confusing_parts"></ul>
    </div>
    <div class="section">
      <h2>Assumed Background</h2>
      <ul id="assumed_background"></ul>
    </div>
    <div class="section">
      <h2>Clarification Questions</h2>
      <ul id="clarification_questions"></ul>
    </div>
    <div class="section">
      <h2>What to Learn Next</h2>
      <ul id="what_to_learn_next"></ul>
    </div>
  </div>

  <script>
    async function analyze() {
      const text = document.getElementById("inputText").value.trim();
      if (!text) return;

      const btn = document.getElementById("analyzeBtn");
      const spinner = document.getElementById("spinner");
      const results = document.getElementById("results");
      const errorBox = document.getElementById("errorBox");

      btn.disabled = true;
      btn.textContent = "Analyzing...";
      spinner.style.display = "block";
      results.style.display = "none";
      errorBox.style.display = "none";

      try {
        const res = await fetch("/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "Something went wrong.");
        }

        const fields = ["confusing_parts", "assumed_background", "clarification_questions", "what_to_learn_next"];
        fields.forEach(field => {
          const ul = document.getElementById(field);
          ul.innerHTML = "";
          (data[field] || []).forEach(item => {
            const li = document.createElement("li");
            li.textContent = item;
            ul.appendChild(li);
          });
        });

        results.style.display = "block";
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Detect Confusion";
        spinner.style.display = "none";
      }
    }

    document.getElementById("inputText").addEventListener("keydown", function(e) {
      if (e.key === "Enter" && e.metaKey) analyze();
    });
  </script>

</body>
</html>
